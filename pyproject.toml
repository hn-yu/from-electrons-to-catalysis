[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "from-electrons-to-catalysis"
version = "0.1.0"
description = "Executable computational chemistry teaching projects"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "ase>=3.23"]

[project.optional-dependencies]
quantum = ["pyscf>=2.8"]
periodic = ["gpaw>=25.7,<26", "gpaw-data"]
reference = ["cantera>=3.2,<4", "pymbar>=4,<5", "ruamel.yaml>=0.18"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["quantum: requires PySCF", "periodic: requires GPAW"]
