name: tests
on: [push, pull_request]
jobs:
  core-and-quantum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[quantum,reference,test]'
      - run: python -m pytest -q
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: python scripts/check_projects.py
