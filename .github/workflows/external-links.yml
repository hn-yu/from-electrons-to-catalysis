name: external links

on:
  push:
    branches: [main]
    paths: ['**/*.md', '**/*.rst', '**/*.html', 'scripts/check_external_links.py', '.github/workflows/external-links.yml']
  pull_request:
    paths: ['**/*.md', '**/*.rst', '**/*.html', 'scripts/check_external_links.py', '.github/workflows/external-links.yml']
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_external_links.py --report runs/external-links.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-links
          path: runs/external-links.json
          if-no-files-found: error
